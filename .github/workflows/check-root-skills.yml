name: Check Root Skills

on:
  pull_request:
    paths:
      - '*/agent-harness/**'
      - 'skills/**'
      - '.github/scripts/sync_root_skills.py'
      - '.github/scripts/validate_root_skills.py'
      - '.github/workflows/check-root-skills.yml'
  push:
    branches:
      - main
    paths:
      - '*/agent-harness/**'
      - 'skills/**'
      - '.github/scripts/sync_root_skills.py'
      - '.github/scripts/validate_root_skills.py'
      - '.github/workflows/check-root-skills.yml'
  workflow_dispatch:

jobs:
  validate-root-skills:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: '3.10'

      - name: Validate root skills mirror
        run: python3 .github/scripts/validate_root_skills.py
