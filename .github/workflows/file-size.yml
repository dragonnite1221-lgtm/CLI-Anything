name: File Size

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  file-size:
    name: 200-line Python limit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: '3.12'
      - name: File size gate
        run: python .github/scripts/check_file_size.py
